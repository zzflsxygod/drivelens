# DriveLens release configuration (committed; read by scripts/release.sh).
#
# NATIVE_BUILDS=1 → release.sh waits for the Windows (draft release + installers) and Android (APK/AAB) workflows
#                   on the tag and only publishes once their assets are attached.
# NATIVE_BUILDS=0 → paused (since v0.15.0): release.sh creates the GitHub release itself and attaches only the
#                   web bundle (DriveLens_X.Y.Z_web.zip from the "Web app (PWA)" workflow).
# To re-enable the apps: set NATIVE_BUILDS=1 here AND uncomment the `push:` trigger blocks in
# .github/workflows/windows.yml and .github/workflows/android.yml. (Env DRIVELENS_NATIVE_BUILDS overrides this file.)
NATIVE_BUILDS=0
