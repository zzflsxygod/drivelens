# DriveLens API — use it next to TeslaMate's docker-compose.yml (same directory):
#   docker compose -f docker-compose.yml -f docker-compose.drivelens.yml up -d drivelens-api
# (or copy the services below into TeslaMate's docker-compose.yml).
# Being in the same compose project, it shares TeslaMate's default network and reaches the database as `database`.
# Variables go into the .env file in the same directory (see docs/install.md):
#   DRIVELENS_DB_PASS=the drivelens_ro password you used with setup.sql
#   DRIVELENS_API_TOKEN=a random string of 32+ characters (openssl rand -hex 24)
# Guide: https://github.com/zzflsxygod/drivelens-releases/blob/main/docs/install.md
services:
  drivelens-api:
    # Prebuilt multi-arch image (linux/amd64 + linux/arm64). Pin a version with e.g. DRIVELENS_IMAGE=ghcr.io/zzflsxygod/drivelens-api:v0.15.1
    image: ${DRIVELENS_IMAGE:-ghcr.io/zzflsxygod/drivelens-api:latest}
    restart: always
    depends_on:
      - database
    environment:
      - DATABASE_URL=postgres://drivelens_ro:${DRIVELENS_DB_PASS:?set DRIVELENS_DB_PASS in .env}@database:5432/${DRIVELENS_DB_NAME:-teslamate}
      - API_TOKEN=${DRIVELENS_API_TOKEN:?set DRIVELENS_API_TOKEN in .env}
      - RUST_LOG=info
      # Optional (v0.11.0+): web origins allowed to call the API from a browser, comma-separated. Unset = only the official
      # web app https://drivelens-app.oharuru.com (the Windows / Android apps are always allowed). Add your own URL if you
      # host the web app yourself; * = any origin. The web app needs an https server address (Cloudflare Tunnel / tailscale serve).
      # - DRIVELENS_CORS_ORIGINS=https://drivelens-app.oharuru.com,https://drivelens-web.example.com
    # Option A (recommended): cloudflared / tailscale in this compose project → remove `ports`, nothing is exposed
    # Option B: cloudflared on the host → publish on the loopback address only
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - com.centurylinklabs.watchtower.enable=true   # only used if you enable the optional watchtower service below
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true   # distroless image without shell/curl; check https://your-domain/health instead

  # ---- Optional: Cloudflare Tunnel (recommended: no open ports, automatic https) ----
  # Create a tunnel in Cloudflare Zero Trust; its Public Hostname points to http://drivelens-api:8080
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: always
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  # ---- Optional: keep drivelens-api up to date automatically (checks every 6 hours) ----
  # watchtower:
  #   image: nickfedor/watchtower:latest
  #   restart: always
  #   environment:
  #     - WATCHTOWER_LABEL_ENABLE=true
  #     - WATCHTOWER_POLL_INTERVAL=21600
  #     - WATCHTOWER_CLEANUP=true
  #     - TZ=${TZ:-UTC}
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
