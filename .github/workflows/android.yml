name: Android app

on:
  # PAUSED since v0.15.0 (web app first): runs only when started by hand (Actions → Run workflow).
  # To re-enable automatic builds on release tags: uncomment the push: block below AND set
  # NATIVE_BUILDS=1 in scripts/release.conf (see the comment there).
  workflow_dispatch:
# push:
#   tags: ["v*"]

permissions:
  contents: read

env:
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    permissions:
      contents: write   # attach installers to the draft release on tags
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Install NDK + SDK platform
        run: |
          pkgs="platforms;android-37.0 build-tools;37.0.0"
          [ "${{ steps.ndk-cache.outputs.cache-hit }}" = "true" ] || pkgs="$pkgs ndk;$NDK_VERSION"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install $pkgs > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          key: android

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/src-tauri/gen/android/**/*.gradle*', 'app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'app/src-tauri/gen/android/buildSrc/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Release keystore (from secrets, outside the workspace)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.p12" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$RUNNER_TEMP/keystore.properties"
          echo "DRIVELENS_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Build signed APK (universal) + AAB
        working-directory: app
        run: npx tauri android build --apk --aab --target aarch64 armv7 x86_64

      - name: Verify signature and collect
        id: out
        run: |
          VER=$(node -p "require('./app/package.json').version")
          OUT=app/src-tauri/gen/android/app/build/outputs
          mkdir -p dist-android
          cp "$OUT/apk/universal/release/app-universal-release.apk" "dist-android/DriveLens_${VER}_android_universal.apk"
          cp "$OUT/bundle/universalRelease/app-universal-release.aab" "dist-android/DriveLens_${VER}_android.aab"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # apksigner output format varies by build-tools ("Signer #1 certificate DN" / "V2 Signer: certificate DN")
          "$BT/apksigner" verify --verbose --print-certs "dist-android/DriveLens_${VER}_android_universal.apk" > apksigner.txt
          grep -E "Verified using v2 scheme|certificate (DN|SHA-256)" apksigner.txt | sort -u
          grep -qi "certificate SHA-256 digest: a970e58a" apksigner.txt || { echo "APK not signed with the DriveLens release key"; exit 1; }
          rm -f apksigner.txt
          jarsigner -verify "dist-android/DriveLens_${VER}_android.aab" | grep -q "jar verified" && echo "AAB signature OK"
          ls -la dist-android
          rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/keystore.properties"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DriveLens-android
          path: dist-android/*
          if-no-files-found: error

      - name: Attach to the draft release (created by the Windows workflow)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # the Windows job creates the draft; wait for it (up to 30 min), create it ourselves as a last resort
          for i in $(seq 60); do gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break; sleep 30; done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "DriveLens $TAG" --notes ""
          gh release upload "$TAG" dist-android/* --repo "$GITHUB_REPOSITORY" --clobber
