name: CI

# Runs for pull requests (including forks). No secrets are used here, and the token is read-only.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: api }
      - run: cargo test --locked

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run build:web

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -n "$BASE" ] || exit 0
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git show -s --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "::error::commit $c has no Signed-off-by line (use git commit -s)"; bad=1; }
          done
          exit $bad
