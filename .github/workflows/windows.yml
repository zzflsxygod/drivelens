name: Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/windows.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build (and create draft release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('DriveLens {0}', github.ref_name) || '' }}
          releaseBody: "Windows 安装包：下载 *-setup.exe（推荐）或 .msi。安装时会自动安装 WebView2（如系统缺少）。"
          releaseDraft: false
          prerelease: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DriveLens-windows-x64
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
