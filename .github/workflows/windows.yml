name: Windows desktop app

on:
  # PAUSED since v0.15.0 (web app first): runs only when started by hand (Actions → Run workflow).
  # To re-enable automatic builds on release tags: uncomment the push: block below AND set
  # NATIVE_BUILDS=1 in scripts/release.conf (see the comment there).
  workflow_dispatch:
# push:
#   branches: [main]
#   tags: ["v*"]
#   paths: ["app/**", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write   # attach installers to the draft release on tags
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build (and create draft release on tags)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('DriveLens {0}', github.ref_name) || '' }}
          releaseBody: "Windows：下载 *-setup.exe（推荐）或 .msi，安装时会自动安装 WebView2（如系统缺少）。\nAndroid（7.0+）：下载 *_android_universal.apk 直接安装（.aab 用于应用商店）。"
          releaseDraft: true  # published by scripts/release.sh after the server reports the new version
          prerelease: true

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DriveLens-windows-x64
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
