name: Web app (PWA)

# Builds the browser / PWA bundle (app/dist-web) and keeps it as an artifact.
# Deploy targets (Cloudflare Pages project from CF_PAGES_PROJECT, default drivelens-app):
#   - production (Pages branch `main`): release tags, or a manual run with target=production
#   - preview    (Pages branch `preview` → https://preview.drivelens-app.pages.dev):
#                 manual run with target=preview (any git ref). Sets VITE_DRIVELENS_CHANNEL=preview.
# Deploy is skipped when CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing.
# Optional repository *variables* (Settings → Secrets and variables → Actions → Variables):
#   DONATE_URL        donation page shown at the bottom of Settings (empty → card hidden)
#   CF_PAGES_PROJECT  Cloudflare Pages project name (default: drivelens-app)
#   WEB_ORIGIN        public origin of the production web app (default: https://drivelens-app.oharuru.com)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (none = build artifact only)"
        type: choice
        options: [none, preview, production]
        default: none
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build web bundle
        working-directory: app
        env:
          VITE_DONATE_URL: ${{ vars.DONATE_URL }}
          # Preview builds point at the Pages preview alias; production keeps WEB_ORIGIN / official default.
          VITE_WEB_ORIGIN: ${{ inputs.target == 'preview' && 'https://preview.drivelens-app.pages.dev' || vars.WEB_ORIGIN || 'https://drivelens-app.oharuru.com' }}
          # Only preview deploys set the channel; production and build-only runs stay unmarked.
          VITE_DRIVELENS_CHANNEL: ${{ inputs.target == 'preview' && 'preview' || '' }}
        run: |
          npm run build:web
          test -f dist-web/sw.js && test -f dist-web/manifest.webmanifest && test -f dist-web/_headers
          du -sh dist-web

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DriveLens-web
          path: app/dist-web/
          if-no-files-found: error

      - name: Deploy to Cloudflare Pages (production)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'drivelens-app' }}
        working-directory: app
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping the Cloudflare Pages deploy (bundle is in the DriveLens-web artifact)"
            exit 0
          fi
          # first deploy: create the Pages project (no-op error when it already exists)
          npx --yes wrangler@4.152.0 pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4.152.0 pages deploy dist-web --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Deploy to Cloudflare Pages (preview)
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'drivelens-app' }}
        working-directory: app
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping the Cloudflare Pages preview deploy (bundle is in the DriveLens-web artifact)"
            exit 0
          fi
          npx --yes wrangler@4.152.0 pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          # Pages branch alias: https://preview.<project>.pages.dev
          npx --yes wrangler@4.152.0 pages deploy dist-web --project-name "$PROJECT" --branch preview --commit-dirty=true
