name: Public repo sync (drivelens-releases)

# Copies the user-facing files (distribution/, docs/install*.md, deploy/setup.sql, deploy/docker-compose.drivelens.yml)
# to the public repo zzflsxygod/drivelens-releases, and on a published release also creates the matching public
# release (with NATIVE_BUILDS=1 also the installers as assets; the web app is only offered at its official URL). Logic: scripts/sync-public.sh.
#
# GITHUB_TOKEN cannot push to another repository, so this needs the secret RELEASES_REPO_TOKEN:
# a fine-grained personal access token, resource owner zzflsxygod, only the repository drivelens-releases,
# permission "Contents: Read and write". Without the secret the job is skipped (notice) and
# scripts/release.sh runs the same script from the build box instead.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["distribution/**", "docs/install*.md", "deploy/setup.sql", "deploy/docker-compose.drivelens.yml", "scripts/sync-public.sh"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror (empty = files only)"
        required: false

permissions:
  contents: read

concurrency:
  group: public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sync
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::notice::RELEASES_REPO_TOKEN not set — skipping (run scripts/sync-public.sh from a machine with gh access instead)"
            exit 0
          fi
          scripts/sync-public.sh ${TAG:+"$TAG"}
