[package]
name = "drivelens"
version = "1.2.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "drivelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
