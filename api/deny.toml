# cargo deny check licenses — every dependency license must be compatible with AGPL-3.0-or-later.
[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-or-later", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "BSL-1.0", "CC0-1.0", "Unlicense", "Unicode-3.0", "CDLA-Permissive-2.0",
]
